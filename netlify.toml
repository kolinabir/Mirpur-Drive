[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Caching: all hashed assets (Vite output) and static data get long-lived
# immutable caching. Netlify auto-applies Brotli compression on the edge for
# text content types (JSON, JS, CSS, HTML).
# ---------------------------------------------------------------------------

# Vite-hashed JS/CSS bundles in /assets/
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Scene data (JSON), maps, street data
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# PBR texture images
[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 3D model files (GLB)
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Audio assets
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Basis Universal transcoder (JS + WASM) used for the KTX2 facade atlas
[[headers]]
  for = "/basis/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
